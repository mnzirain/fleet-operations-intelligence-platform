name: Fleet Operations CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Code Quality and Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fleet_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: fleet_operations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_app -d fleet_operations_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql+psycopg://fleet_app:ci_test_password@localhost:5432/fleet_operations_test"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Check code quality
        run: python -m ruff check .

      - name: Check code formatting
        run: python -m ruff format --check .

      - name: Run automated tests
        run: python -m pytest -v
